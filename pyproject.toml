[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-cost-management-mcp"
version = "0.1.0"
description = "Governed MCP server for Microsoft 365 Copilot Cost Management"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.12.0,<2",
  "httpx>=0.27.0",
  "msal>=1.31.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1"
]

[project.scripts]
copilot-cost-management-mcp = "copilot_cost_management.server:main"

[tool.setuptools.packages.find]
where = ["src"]
